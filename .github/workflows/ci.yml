name: GitOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository information
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
          git status

      - name: Run automated validation
        run: bash tests/validate.sh

  deploy-simulation:
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build deployment package
        run: |
          mkdir -p deploy-package
          cp README.md deploy-package/
          cp -r src deploy-package/
          echo "Commit: $GITHUB_SHA" > deploy-package/deployment-info.txt
          echo "Environment: lab" >> deploy-package/deployment-info.txt

      - name: Show desired state
        run: |
          find deploy-package -type f -maxdepth 3 -print
          cat deploy-package/deployment-info.txt

      - name: Create deployment archive
        run: tar -czf gitops-lab02.tar.gz deploy-package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitops-lab02-package
          path: gitops-lab02.tar.gz